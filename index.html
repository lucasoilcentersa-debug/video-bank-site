:root{color-scheme:light;--ink:#17352f;--muted:#52665f;--green:#075e4c;--line:#d9e2dc;--surface:#fff;--paper:#f4f7f4;--lime:#d5ee8d;font:16px/1.6 'Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}button,input,select,a{font:inherit}button,select,a{cursor:pointer}button{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3789b5;outline-offset:3px}a{color:var(--green);text-decoration:none}header{background:white;border-bottom:1px solid var(--line)}.bar,main,footer{max-width:1240px;margin:auto;padding-inline:clamp(18px,4vw,54px)}.bar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:13px}.brand{display:flex;align-items:center;gap:11px;font-weight:750}.mark{display:grid;place-items:center;background:#104f43;border-radius:10px;width:39px;height:39px}.mark i{display:block;width:20px;height:17px;border:2px solid var(--lime);border-radius:3px;box-shadow:-4px 4px 0 -2px #104f43,-4px 4px 0 0 var(--lime);position:relative}.mark i:after{content:"";position:absolute;top:3px;left:6px;border-block:4px solid transparent;border-left:6px solid #fff}.bar a{font-weight:600;font-size:.9rem}.hero{isolation:isolate;position:relative;overflow:hidden;background:#104a3f;color:white;border-radius:22px;margin-block:30px 24px;min-height:185px;display:flex;align-items:center;padding:28px clamp(22px,5vw,60px)}.hero:after{position:absolute;content:"";inset:0;background:repeating-linear-gradient(114deg,transparent 0 30px,#ffffff08 31px,transparent 32px 55px);z-index:-2}.hero h1{font-size:clamp(2.3rem,5.6vw,4.2rem);margin:0;letter-spacing:-.055em;line-height:1.25}.hero p{margin:8px 0 0;color:#e3efe4}.visual{position:absolute;left:3%;width:35%;top:0;bottom:0;z-index:-1;display:flex;align-items:center;justify-content:center;direction:ltr}.visual img{width:34%;height:83%;object-fit:cover;border-radius:6px;box-shadow:0 12px 35px #001e2088;border:2px so ransition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#7eac94}.cover{width:100%;height:158px;position:relative;display:grid;place-items:center;background:#e6ede8;overflow:hidden}.cover:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#dce7dc 0 1px,transparent 1px 18px)}.cover img{position:relative;width:100%;height:100%;object-fit:contain;background:#1e2829}.caption{padding:14px 16px;display:grid;gap:4px}.eyebrow{color:#466e57;font-size:.83rem}.name{font-size:1.05rem;line-height:1.55;font-weight:700}.meta{color:var(--muted);font-size:.86rem}.notice{background:white;color:var(--muted);border:1px dashed #bdcbbf;padding:24px;border-radius:12px;text-align:center}.detail{padding:22px;background:white;border:1px solid var(--line);border-radius:16px;margin:18px 0}.detail h2,.detail h3{margin:8px 0}.detail p{margin:6px 0 16px}.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(245px,100%),1fr));gap:14px}.asset{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.asset img{height:165px;width:100%;object-fit:contain;background:#e7eee8;border-radius:6px}.asset h3{font-size:1rem;overflow-wrap:anywhere}.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.actions a{font-weight:600}.primary{border:0;border-radius:9px;color:white;background:var(--green);padding:8px 15px}.viewer{border:0;border-radius:16px;width:min(870px,95vw);padding:15px;color:var(--ink)}.viewer::backdrop{background:#12221ecf}.viewer iframe{width:100%;height:min(68vh,640px);border:0;background:#18201b;margin:10px 0}.viewer header{display:flex;align-items:center;justify-content:space-between;gap:12px}.viewer h3{font-size:1rem;margin:0}.keybox{max-width:830px;padding:18px;background:#f4f7f2;border-radius:10px;margin-bottom:14px}.keybox b,.keybox span{display:block}.keybox p{margin:.3rem 0 1rem}.keybox a{margin-inline-end:16px}.tabnote{margin:12px 0}.tabnote a{font-weight:650}footer{mar 'use strict';
const el=id=>document.getElementById(id);
const types={post:'البوستات',video:'الفيديوهات',key:'معلومات المنتج'};
const standard=['زيوت المحرك','معالجات المكينة','معالجات الوقود','معالج القير'];
const state={year:'',type:'',category:'',brand:'',query:'',product:''};
let db, products, mediaByProduct;
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function button(title,pressed,action){const b=node('button','',title);b.type='button';b.setAttribute('aria-pressed',String(pressed));b.onclick=action;return b}
function link(label,url){const a=node('a','',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function image(id){const i=node('img');i.alt='';i.loading='lazy';i.referrerPolicy='no-referrer';i.src='https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w600';i.onerror=()=>{i.hidden=true};return i}
function normalize(s){return (s||'').toLowerCase().normalize('NFKC').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[\u064B-\u065Fـ]/g,'').trim()}
function changed(k,v){
 state[k]=v;
 if(k==='year')state.brand='';
 if(k==='year'||k==='brand')state.type='';
 if(k!=='query'&&k!=='product'){state.query='';el('search').value=''}
 if(k!=='product')state.product='';
 render();
}
function sheetURL(p){return db.sheetUrl+(p?'#range='+encodeURIComponent("'مفاتيح المنتجات'!A"+p.row):'')}
function assets(p){return (mediaByProduct.get(p.id)||[]).filter(m=>m.year===state.year)}
function relevant(p){const a=assets(p);return state.type==='key'?p.years.includes(state.year):a.some(m=>m.type===state.type)}
function visibleAssets(p){const a=assets(p);return state.type==='key'?a:a.filter(m=>m.type===state.type)}
function render(){
 el('years').replaceChildren(...['2025','2026'].map(y=>button('نموذج '+y,y===state.year,()=>changed('year',y))));
 el('brandsStep').hidden=!state.year;
 el('brands').replaceChildren(...['شيلد','لوكاس'].map(b=>button(b,b===state.brand,()=>changed('brand',b))));
 el('typesStep').hidden=!state.brand;
 el('types').replaceChildren(...['post','video','key'].map(t=>button(types[t],state.type===t,()=>changed('type',t))));
 if(!state.type){el('browse').hidden=true;el('detail').hidden=true;el('cards').replaceChildren();return}
 const available=products.filter(p=>p.brand===state.brand&&relevant(p));
 const selected=products.find(p=>p.id===state.product);
 el('browse').hidden=!!selected;el('detail').hidden=!selected;
 if(selected){showProduct(selected);return}
 const items=available.filter(p=>(!state.category||p.category===state.category)&&(!state.brand||p.brand===state.brand)&&normalize([p.name,p.english,p.brand].join(' ')).includes(normalize(state.query)));
 el('count').textContent=items.length+' نتيجة';el('sheetlink').hidden=true;el('sheetlink').replaceChildren(link('فتح جدول مفاتيح المنتجات',sheetURL()));
 el('cards').replaceChildren(...items.map(p=>{const b=node('button','card'),cap=node('span','caption');const a=visibleAssets(p);cap.append(node('span','eyebrow',p.brand+' · '+p.category),node('span','name',p.name),node('span','meta',state.type==='key'?'عرض معلومات المنتج':(a.length+' '+(state.type==='post'?'بوست':'فيديو'))));b.append(cap);b.onclick=()=>{changed('product',p.id);el('detail').scrollIntoView({block:'start'})};return b}));
 el('empty').hidden=!!items.length;el('empty').textContent='لا توجد مواد مطابقة لهذا الاختيار في نموذج '+state.year+'. اختر نوع محتوى أو نموذجًا آخر.';
}
function showProduct(p){
 const root=el('detail');root.replaceChildren();const back=node('button','outline','العودة إلى المنتجات');back.onclick=()=>{state.product='';render()};root.append(back,node('p','eyebrow','نموذج '+state.year+' / '+types[state.type]+' / '+p.category),node('h2','',p.name),node('p','meta',p.brand+(p.english?' · '+p.english:'')));
 if(state.type==='key'){const box=node('div','keybox');box.append(node('b','','معلومات المنتج'),node('p','',p.key||'راجع المادة الأصلية لمعلومات المنتج.'),link('فتح صف المنتج في Google Sheets',sheetURL(p)));if(p.source)box.append(link('المصدر',p.source));root.append(box);return}
 const grid=node('div','assets');visibleAssets(p).forEach(m=>{const card=node('article','asset'),actions=node('div','actions'),view=node('button','primary',m.type==='video'?'تشغيل الفيديو':'عرض البوست');view.onclick=()=>openFile(m);actions.append(view,link('فتح في Drive',driveUrl(m.id)));card.append(image(m.id),node('h3','',m.title),actions);grid.append(card)});root.append(grid);
}
const driveUrl=id=>'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view';
function openFile(m){const f=node('iframe');f.title=m.title;f.allow='autoplay; fullscreen';f.allowFullscreen=true;f.src=driveUrl(m.id).replace('/view','/preview');el('frame').replaceChildren(f);el('viewerTitle').textContent=m.title;el('original').href=driveUrl(m.id);el('viewer').showModal()}
el('close').onclick=()=>el('viewer').close();el('viewer').onclose=()=>el('frame').replaceChildren();el('search').oninput=e=>changed('query',e.target.value);
function ready(data){db=data;products=db.products;mediaByProduct=new Map();for(const m of db.media){if(!mediaByProduct.has(m.product))mediaByProduct.set(m.product,[]);mediaByProduct.get(m.product).push(m)}el('loading').hidden=true;el('library').hidden=false;render()}
function failed(){el('loading').textContent='تعذّر تحميل جدول المنتجات. تأكد من تسجيل الدخول بالحساب المصرّح له ثم ';const b=node('button','outline','أعد المحاولة');b.onclick=start;el('loading').append(b)}
function start(){if(window.google?.script?.run){google.script.run.withSuccessHandler(ready).withFailureHandler(failed).getCatalog()}else if(window.previewCatalog){ready(window.previewCatalog)}else{failed()}}start();
</script></body></html>
